<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" fill="none">
  <rect width="720" height="360" rx="16" fill="#FAFAFA"/>
  <text x="360" y="34" font-family="Arial" font-size="15" fill="#404040" text-anchor="middle" font-weight="bold">Two Question Types, Two Answer Tracks — Nursing Panels Mix Both</text>

  <!-- left track: situational -->
  <g font-family="Arial">
    <rect x="24" y="56" width="328" height="188" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <text x="188" y="80" fill="#1D4ED8" font-size="12.5" text-anchor="middle" font-weight="bold">SITUATIONAL — “What would you do if…”</text>
    <text x="188" y="98" fill="#666666" font-size="10.5" text-anchor="middle">hypothetical · ~40 seconds · reasoning is graded</text>
    <rect x="44" y="112" width="288" height="34" rx="8" fill="#DBEAFE"/>
    <text x="188" y="127" fill="#1E40AF" font-size="10.5" text-anchor="middle" font-weight="bold">1 · Name the priority first</text>
    <text x="188" y="140" fill="#1E40AF" font-size="9.5" text-anchor="middle">“airway beats paperwork — safety decides the order”</text>
    <rect x="44" y="152" width="288" height="34" rx="8" fill="#FEF3C7"/>
    <text x="188" y="167" fill="#92400E" font-size="10.5" text-anchor="middle" font-weight="bold">2 · 2–3 concrete actions</text>
    <text x="188" y="180" fill="#92400E" font-size="9.5" text-anchor="middle">who you notify · what you check · what you document</text>
    <rect x="44" y="192" width="288" height="34" rx="8" fill="#F3E8FF"/>
    <text x="188" y="207" fill="#6B21A8" font-size="10.5" text-anchor="middle" font-weight="bold">3 · Expected result</text>
    <text x="188" y="220" fill="#6B21A8" font-size="9.5" text-anchor="middle">“patient stable, event filed, huddle updated”</text>
  </g>

  <!-- right track: behavioral -->
  <g font-family="Arial">
    <rect x="368" y="56" width="328" height="188" rx="12" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
    <text x="532" y="80" fill="#15803D" font-size="12.5" text-anchor="middle" font-weight="bold">BEHAVIORAL — “Tell me about a time…”</text>
    <text x="532" y="98" fill="#666666" font-size="10.5" text-anchor="middle">real shift · 60–90 seconds · story is graded</text>
    <rect x="388" y="112" width="288" height="34" rx="8" fill="#DCFCE7"/>
    <text x="532" y="127" fill="#166534" font-size="10.5" text-anchor="middle" font-weight="bold">S + T — one sentence each</text>
    <text x="532" y="140" fill="#166534" font-size="9.5" text-anchor="middle">ward context, then your duty in first person</text>
    <rect x="388" y="152" width="288" height="34" rx="8" fill="#FEF3C7"/>
    <text x="532" y="167" fill="#92400E" font-size="10.5" text-anchor="middle" font-weight="bold">A — the middle 45 seconds</text>
    <text x="532" y="180" fill="#92400E" font-size="9.5" text-anchor="middle">2–3 moves, each starting with “I”</text>
    <rect x="388" y="192" width="288" height="34" rx="8" fill="#F3E8FF"/>
    <text x="532" y="207" fill="#6B21A8" font-size="10.5" text-anchor="middle" font-weight="bold">R — an outcome a charge nurse believes</text>
    <text x="532" y="220" fill="#6B21A8" font-size="9.5" text-anchor="middle">a changed process, a number, a kept habit</text>
  </g>

  <!-- pivot arrow -->
  <g font-family="Arial">
    <path d="M 352 250 C 352 268 352 268 352 268" stroke="#94A3B8" stroke-width="0" fill="none"/>
    <rect x="160" y="256" width="400" height="30" rx="15" fill="#0F172A"/>
    <text x="360" y="275" fill="#FFFFFF" font-size="11" text-anchor="middle" font-weight="bold">The pivot: answer the hypothetical in 20s, then “something similar happened on my shift…”</text>
  </g>

  <!-- bottom hook -->
  <g font-family="Arial">
    <text x="360" y="318" font-size="11" fill="#404040" text-anchor="middle">Same rubric underneath: clinical judgment, speak-up culture, communication.</text>
    <text x="360" y="338" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="bold">Say both tracks out loud and get S/T/A/R scored — free, no signup, 7 languages.</text>
  </g>
</svg>
