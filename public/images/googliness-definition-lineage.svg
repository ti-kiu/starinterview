<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="16" fill="#FAFAFA"/>
  <text x="360" y="34" font-family="Arial" font-size="15" fill="#404040" text-anchor="middle" font-weight="bold">"Googliness" has four public definitions — which one gets you scored?</text>

  <!-- timeline nodes -->
  <line x1="60" y1="86" x2="660" y2="86" stroke="#9CA3AF" stroke-width="2"/>
  <g font-family="Arial">
    <!-- node 1 -->
    <circle cx="100" cy="86" r="7" fill="#6B7280"/>
    <text x="100" y="70" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">internal slang</text>
    <text x="100" y="112" font-size="9.5" fill="#6B7280" text-anchor="middle">"Googley" = do the right thing,</text>
    <text x="100" y="125" font-size="9.5" fill="#6B7280" text-anchor="middle">never formally defined — drifted</text>
    <text x="100" y="138" font-size="9.5" fill="#6B7280" text-anchor="middle">into vague "culture fit"</text>

    <!-- node 2 -->
    <circle cx="260" cy="86" r="7" fill="#3B82F6"/>
    <text x="260" y="70" font-size="11" fill="#1D4ED8" text-anchor="middle" font-weight="bold">2015 · Work Rules! (Bock)</text>
    <text x="260" y="112" font-size="9.5" fill="#6B7280" text-anchor="middle">fun · intellectual humility ·</text>
    <text x="260" y="125" font-size="9.5" fill="#6B7280" text-anchor="middle">conscientiousness · ambiguity ·</text>
    <text x="260" y="138" font-size="9.5" fill="#6B7280" text-anchor="middle">courageous/interesting paths</text>

    <!-- node 3 -->
    <circle cx="430" cy="86" r="7" fill="#EAB308"/>
    <text x="430" y="70" font-size="11" fill="#A16207" text-anchor="middle" font-weight="bold">official prep pack</text>
    <text x="430" y="112" font-size="9.5" fill="#6B7280" text-anchor="middle">moonshot dreams · thrive in</text>
    <text x="430" y="125" font-size="9.5" fill="#6B7280" text-anchor="middle">ambiguity · value feedback ·</text>
    <text x="430" y="138" font-size="9.5" fill="#6B7280" text-anchor="middle">challenge status quo · do right</text>

    <!-- node 4 -->
    <circle cx="600" cy="86" r="7" fill="#22C55E"/>
    <text x="600" y="70" font-size="11" fill="#15803D" text-anchor="middle" font-weight="bold">what scorers use now</text>
    <text x="600" y="112" font-size="9.5" fill="#6B7280" text-anchor="middle">rubric behaviors: ambiguity ·</text>
    <text x="600" y="125" font-size="9.5" fill="#6B7280" text-anchor="middle">feedback · status quo · user first ·</text>
    <text x="600" y="138" font-size="9.5" fill="#6B7280" text-anchor="middle">team care · integrity</text>
  </g>

  <!-- verdict -->
  <text x="40" y="176" font-family="Arial" font-size="12" fill="#404040">Verdict: the word is being retired internally, but the rubric isn't. Interviewers still score the</text>
  <text x="40" y="192" font-family="Arial" font-size="12" fill="#404040">behaviors in green — so prep stories against those six, not against anyone's favorite quote.</text>

  <!-- pills -->
  <g font-family="Arial" font-size="11">
    <rect x="40" y="216" width="150" height="26" rx="13" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="115" y="233" fill="#1D4ED8" text-anchor="middle">Free · no signup</text>
    <rect x="202" y="216" width="170" height="26" rx="13" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.5"/>
    <text x="287" y="233" fill="#15803D" text-anchor="middle">Scored on 4 dimensions</text>
    <rect x="384" y="216" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#EAB308" stroke-width="1.5"/>
    <text x="444" y="233" fill="#A16207" text-anchor="middle">Voice input</text>
    <rect x="516" y="216" width="110" height="26" rx="13" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.5"/>
    <text x="571" y="233" fill="#7E22CE" text-anchor="middle">7 languages</text>
  </g>

  <!-- footer -->
  <text x="40" y="272" font-family="Arial" font-size="10" fill="#9CA3AF">Sources: Google's public prep materials, its ex-People-Ops SVP's book, current interviewer training</text>
  <text x="40" y="288" font-family="Arial" font-size="10" fill="#9CA3AF">summaries. Spellings Googliness / Googleyness / Googlyness all index to the same dimension.</text>
</svg>
