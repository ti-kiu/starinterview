    <text x="130" y="176" text-anchor="middle" font-size="11" fill="#94a3b8">interviewer training pairing</text>
    <rect x="24" y="196" width="212" height="44" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="214" text-anchor="middle" fill="#e0e7ff" font-weight="600">"Leadership and Rapport"</text>
    <text x="130" y="232" text-anchor="middle" font-size="11" fill="#94a3b8">label in recent loops</text>
    <rect x="24" y="252" width="212" height="36" rx="10" fill="#1e293b" stroke="#334155"/>
