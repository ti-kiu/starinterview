<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" fill="none">
  <rect width="720" height="320" rx="16" fill="#FAFAFA"/>
  <text x="360" y="34" font-family="Arial" font-size="15" fill="#404040" text-anchor="middle" font-weight="bold">The Amazon LP Answer Loop — from story to offer</text>

  <!-- step boxes -->
  <g font-family="Arial" font-size="12">
    <rect x="28" y="70" width="150" height="92" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <text x="103" y="96" fill="#1D4ED8" text-anchor="middle" font-weight="bold">1. Map 8–12</text>
    <text x="103" y="114" fill="#666666" text-anchor="middle">real stories to the</text>
    <text x="103" y="132" fill="#666666" text-anchor="middle">16 Leadership</text>
    <text x="103" y="150" fill="#666666" text-anchor="middle">Principles</text>

    <rect x="218" y="70" width="150" height="92" rx="12" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
    <text x="293" y="96" fill="#15803D" text-anchor="middle" font-weight="bold">2. Build in STAR</text>
    <text x="293" y="114" fill="#666666" text-anchor="middle">S+T ≤ 30s</text>
    <text x="293" y="132" fill="#666666" text-anchor="middle">Action 60–90s</text>
    <text x="293" y="150" fill="#666666" text-anchor="middle">Result with metrics</text>

    <rect x="408" y="70" width="150" height="92" rx="12" fill="#FFFFFF" stroke="#E8614D" stroke-width="2"/>
    <text x="483" y="96" fill="#C2410C" text-anchor="middle" font-weight="bold">3. Say it out loud</text>
    <text x="483" y="114" fill="#666666" text-anchor="middle">mic on, no script</text>
    <text x="483" y="132" fill="#666666" text-anchor="middle">scored S·T·A·R</text>
    <text x="483" y="150" fill="#666666" text-anchor="middle">each 0–10</text>

    <rect x="598" y="70" width="94" height="92" rx="12" fill="#FFFFFF" stroke="#A855F7" stroke-width="2"/>
    <text x="645" y="96" fill="#7E22CE" text-anchor="middle" font-weight="bold">4. Survive</text>
    <text x="645" y="114" fill="#666666" text-anchor="middle">the 3-level</text>
    <text x="645" y="132" fill="#666666" text-anchor="middle">Bar Raiser</text>
    <text x="645" y="150" fill="#666666" text-anchor="middle">follow-up</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#9CA3AF" stroke-width="2" fill="none">
    <path d="M178 116H214" marker-end="url(#arrA)"/>
    <path d="M368 116H404" marker-end="url(#arrA)"/>
    <path d="M558 116H594" marker-end="url(#arrA)"/>
  </g>

  <!-- loop back arrow -->
  <path d="M645 166V216H103V170" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrA)"/>
  <text x="374" y="236" font-family="Arial" font-size="11" fill="#6B7280" text-anchor="middle">one story can serve 2–3 principles — rotate it until every LP has proof</text>

  <!-- CTA strip -->
  <rect x="28" y="258" width="664" height="40" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="360" y="283" font-family="Arial" font-size="12" fill="#4338CA" text-anchor="middle" font-weight="bold">Practice free · no signup · voice scoring in 7 languages — built for non-native English speakers</text>

  <defs>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
