<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" fill="none">
  <rect width="720" height="350" rx="16" fill="#FAFAFA"/>
  <text x="360" y="34" font-family="Arial" font-size="15" fill="#404040" text-anchor="middle" font-weight="bold">Nursing Behavioral Questions — What Each Question Really Grades</text>

  <!-- question family cards -->
  <g font-family="Arial">
    <rect x="24" y="56" width="128" height="80" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <text x="88" y="78" fill="#1D4ED8" font-size="10.5" text-anchor="middle" font-weight="bold">"angry patient</text>
    <text x="88" y="91" fill="#1D4ED8" font-size="10.5" text-anchor="middle" font-weight="bold">refused care"</text>
    <text x="88" y="112" fill="#666666" font-size="10" text-anchor="middle">grades</text>
    <text x="88" y="125" fill="#333333" font-size="10" font-weight="bold" text-anchor="middle">de-escalation</text>

    <rect x="160" y="56" width="128" height="80" rx="10" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
    <text x="224" y="78" fill="#15803D" font-size="10.5" text-anchor="middle" font-weight="bold">"you spotted</text>
    <text x="224" y="91" fill="#15803D" font-size="10.5" text-anchor="middle" font-weight="bold">a safety risk"</text>
    <text x="224" y="112" fill="#666666" font-size="10" text-anchor="middle">grades</text>
    <text x="224" y="125" fill="#333333" font-size="10" font-weight="bold" text-anchor="middle">speak-up culture</text>

    <rect x="296" y="56" width="128" height="80" rx="10" fill="#FFFFFF" stroke="#E8614D" stroke-width="2"/>
    <text x="360" y="78" fill="#C2410C" font-size="10.5" text-anchor="middle" font-weight="bold">"conflict with</text>
    <text x="360" y="91" fill="#C2410C" font-size="10.5" text-anchor="middle" font-weight="bold">a coworker"</text>
    <text x="360" y="112" fill="#666666" font-size="10" text-anchor="middle">grades</text>
    <text x="360" y="125" fill="#333333" font-size="10" font-weight="bold" text-anchor="middle">professionalism</text>

    <rect x="432" y="56" width="128" height="80" rx="10" fill="#FFFFFF" stroke="#A855F7" stroke-width="2"/>
    <text x="496" y="78" fill="#7E22CE" font-size="10.5" text-anchor="middle" font-weight="bold">"two urgent</text>
    <text x="496" y="91" fill="#7E22CE" font-size="10.5" text-anchor="middle" font-weight="bold">tasks at once"</text>
    <text x="496" y="112" fill="#666666" font-size="10" text-anchor="middle">grades</text>
    <text x="496" y="125" fill="#333333" font-size="10" font-weight="bold" text-anchor="middle">triage judgment</text>

    <rect x="568" y="56" width="128" height="80" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="632" y="78" fill="#B45309" font-size="10.5" text-anchor="middle" font-weight="bold">"a mistake</text>
    <text x="632" y="91" fill="#B45309" font-size="10.5" text-anchor="middle" font-weight="bold">you owned"</text>
    <text x="632" y="112" fill="#666666" font-size="10" text-anchor="middle">grades</text>
    <text x="632" y="125" fill="#333333" font-size="10" font-weight="bold" text-anchor="middle">integrity</text>
  </g>

  <!-- answer shape strip -->
  <text x="360" y="168" font-family="Arial" font-size="12" fill="#404040" text-anchor="middle" font-weight="bold">The answer shape that fits all five: 60–90 seconds, STAR</text>
  <g font-family="Arial">
    <rect x="40" y="184" width="110" height="52" rx="8" fill="#DBEAFE"/>
    <text x="95" y="205" fill="#1D4ED8" font-size="11" text-anchor="middle" font-weight="bold">Situation</text>
    <text x="95" y="222" fill="#1E40AF" font-size="10" text-anchor="middle">~10s · ward context</text>

    <rect x="170" y="184" width="110" height="52" rx="8" fill="#DCFCE7"/>
    <text x="225" y="205" fill="#15803D" font-size="11" text-anchor="middle" font-weight="bold">Task</text>
    <text x="225" y="222" fill="#166534" font-size="10" text-anchor="middle">~10s · your duty</text>

    <rect x="300" y="184" width="240" height="52" rx="8" fill="#FEF3C7"/>
    <text x="420" y="205" fill="#B45309" font-size="11" text-anchor="middle" font-weight="bold">Action — the middle of the story</text>
    <text x="420" y="222" fill="#92400E" font-size="10" text-anchor="middle">~45s · 2-3 moves, each starting with "I"</text>

    <rect x="560" y="184" width="120" height="52" rx="8" fill="#F3E8FF"/>
    <text x="620" y="205" fill="#7E22CE" font-size="11" text-anchor="middle" font-weight="bold">Result</text>
    <text x="620" y="222" fill="#6B21A8" font-size="10" text-anchor="middle">~15s · outcome, stated</text>
  </g>

  <!-- bottom hook -->
  <g font-family="Arial">
    <rect x="40" y="258" width="640" height="58" rx="12" fill="#0F172A"/>
    <text x="360" y="282" fill="#FFFFFF" font-size="12" text-anchor="middle" font-weight="bold">New-grad? Clinicals, simulation, and volunteer stories count — same STAR shape.</text>
    <text x="360" y="302" fill="#93C5FD" font-size="11" text-anchor="middle">Say your answer out loud and get S/T/A/R scores back — free, no signup, 7 languages.</text>
  </g>
</svg>
