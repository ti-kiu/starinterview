<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Crosswalk: Google's four googliness framing questions mapped onto the six scored rubric behaviors and the evidence each answer needs">
  <rect width="760" height="400" rx="16" fill="#0f172a"/>
  <text x="380" y="34" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Four framing questions. Six scored behaviors. One crosswalk.</text>
  <text x="380" y="56" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Google asks four questions; the rating form scores six behaviors. Each row = one story your bank needs.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- header row -->
    <text x="40" y="92" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">FRAMING QUESTION (GOOGLE'S WORDS)</text>
    <text x="350" y="92" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">BEHAVIORS TRIGGERED</text>
    <text x="560" y="92" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">EVIDENCE A 3–4 NEEDS</text>
    <!-- row 1 -->
    <rect x="24" y="102" width="712" height="62" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="128" fill="#e2e8f0" font-size="13" font-weight="600">How you work — individually</text>
    <text x="40" y="148" fill="#e2e8f0" font-size="13" font-weight="600">and on a team</text>
    <text x="350" y="128" fill="#a5b4fc" font-size="12">• Cares about the team</text>
    <text x="350" y="148" fill="#a5b4fc" font-size="12">• Challenges the status quo</text>
    <text x="560" y="128" fill="#cbd5e1" font-size="11">Credit flowed outward +</text>
    <text x="560" y="146" fill="#cbd5e1" font-size="11">a decision contested</text>
    <text x="560" y="160" fill="#cbd5e1" font-size="11">with data</text>
    <!-- row 2 -->
    <rect x="24" y="172" width="712" height="62" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="198" fill="#e2e8f0" font-size="13" font-weight="600">How you help</text>
    <text x="40" y="218" fill="#e2e8f0" font-size="13" font-weight="600">others</text>
    <text x="350" y="198" fill="#a5b4fc" font-size="12">• Does the right thing</text>
    <text x="350" y="218" fill="#a5b4fc" font-size="12">• Values feedback</text>
    <text x="560" y="198" fill="#cbd5e1" font-size="11">Unasked help with a</text>
    <text x="560" y="212" fill="#cbd5e1" font-size="11">measurable effect + a</text>
    <text x="560" y="226" fill="#cbd5e1" font-size="11">correction that changed practice</text>
    <!-- row 3 -->
    <rect x="24" y="242" width="712" height="62" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="268" fill="#e2e8f0" font-size="13" font-weight="600">How you navigate</text>
    <text x="40" y="288" fill="#e2e8f0" font-size="13" font-weight="600">ambiguity</text>
    <text x="350" y="268" fill="#a5b4fc" font-size="12">• Thrives in ambiguity</text>
    <text x="350" y="288" fill="#a5b4fc" font-size="12">• Puts the user first</text>
    <text x="560" y="268" fill="#cbd5e1" font-size="11">You created the spec</text>
    <text x="560" y="282" fill="#cbd5e1" font-size="11">(who you asked, proxy</text>
    <text x="560" y="296" fill="#cbd5e1" font-size="11">metric) + user as tiebreaker</text>
    <!-- row 4 -->
    <rect x="24" y="312" width="712" height="62" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="338" fill="#e2e8f0" font-size="13" font-weight="600">How you push outside</text>
    <text x="40" y="358" fill="#e2e8f0" font-size="13" font-weight="600">your comfort zone</text>
    <text x="350" y="338" fill="#a5b4fc" font-size="12">• Thrives in ambiguity</text>
    <text x="350" y="358" fill="#a5b4fc" font-size="12">• Status quo, self-directed</text>
    <text x="560" y="338" fill="#cbd5e1" font-size="11">Took it before ready,</text>
    <text x="560" y="352" fill="#cbd5e1" font-size="11">cost named — humility</text>
    <text x="560" y="366" fill="#cbd5e1" font-size="11">lives in this cell</text>
  </g>
  <text x="380" y="393" text-anchor="middle" fill="#818cf8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Coverage check: lay 8–10 STAR stories over the four rows — an empty row is the round you get caught on. Free · no signup · per-dimension scoring · 7 languages.</text>
</svg>
